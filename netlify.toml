[build.environment]
  NODE_VERSION = "22"

# Adsterra (Native Banner, issue #28): zone hosts + invoke.js runtime domains.
# These rotate — review them against CSP violation reports before adding more.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms https://cdn.counter.dev https://www.highperformanceformat.com https://*.profitableratecpmnetwork.com https://*.effectivegatecpm.com https://fizzyacerbitymellow.com https://sleepoverlimitprofound.com https://exemplarfederallithe.com https://furiousexpansion.com https://consumeririssalary.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com https://*.g.doubleclick.net https://www.google.com https://t.counter.dev https://cdn.counter.dev https://www.highperformanceformat.com https://*.profitableratecpmnetwork.com https://*.effectivegatecpm.com https://fizzyacerbitymellow.com https://sleepoverlimitprofound.com https://exemplarfederallithe.com https://furiousexpansion.com https://consumeririssalary.com https://protrafficinspector.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.highperformanceformat.com https://*.profitableratecpmnetwork.com https://*.effectivegatecpm.com https://fizzyacerbitymellow.com https://sleepoverlimitprofound.com https://exemplarfederallithe.com https://furiousexpansion.com https://consumeririssalary.com https://cdn.cloudvideosa.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/safety-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Fallback de SPA: rotas como /privacy-policy davam 404 no acesso direto
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
